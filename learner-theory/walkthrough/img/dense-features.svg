<rect width="940" height="396" rx="10" fill="#fcfcfb"/>
<text x="24" y="32" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">How much the hidden layer learned under each market design</text><text x="24" y="52" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Best loss any linear readout reaches on the hidden features: at the start ÷ after 30 passes. 1× means the hidden layer learned nothing.</text><circle cx="250" cy="74" r="5" fill="#2a78d6"/><text x="260" y="78" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">ReLU network</text><circle cx="370" cy="74" r="5" fill="#eb6834"/><text x="380" y="78" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">tanh network</text><line x1="281.2" y1="86" x2="281.2" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="281.2" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0.2×</text><line x1="380.6" y1="86" x2="380.6" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="380.6" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">0.5×</text><line x1="455.8" y1="86" x2="455.8" y2="322" stroke="#c3c2b7" stroke-width="1"/><text x="455.8" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">1×</text><line x1="531" y1="86" x2="531" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="531" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">2×</text><line x1="630.4" y1="86" x2="630.4" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="630.4" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">5×</text><line x1="705.6" y1="86" x2="705.6" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="705.6" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">10×</text><line x1="780.8" y1="86" x2="780.8" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="780.8" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">20×</text><line x1="880.2" y1="86" x2="880.2" y2="322" stroke="#e1e0d9" stroke-width="1"/><text x="880.2" y="340" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">50×</text><text x="461.8" y="96" font-size="11.5" fill="#898781" text-anchor="start" font-weight="400">no learning</text><text x="236" y="108" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">backprop (honest market, VCG)</text><line x1="654.2" y1="104" x2="842.7" y2="104" stroke="#e1e0d9" stroke-width="2"/><circle cx="654.2" cy="104" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="842.7" cy="104" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="842.7" y="92" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">35×</text><text x="654.2" y="92" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">6.2×</text><text x="236" y="148" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">access sold at its true value</text><line x1="581.3" y1="144" x2="765.2" y2="144" stroke="#e1e0d9" stroke-width="2"/><circle cx="581.3" cy="144" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="765.2" cy="144" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="236" y="188" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">node perturbation</text><line x1="542.7" y1="184" x2="651.5" y2="184" stroke="#e1e0d9" stroke-width="2"/><circle cx="542.7" cy="184" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="651.5" cy="184" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="236" y="228" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">honest price, averaged</text><line x1="462.8" y1="224" x2="482.3" y2="224" stroke="#e1e0d9" stroke-width="2"/><circle cx="462.8" cy="224" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="482.3" cy="224" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="236" y="268" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">voluntary payment</text><line x1="455.8" y1="264" x2="455.8" y2="264" stroke="#e1e0d9" stroke-width="2"/><circle cx="455.8" cy="264" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="455.8" cy="264" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="467.8" y="268" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">both 1×</text><text x="236" y="308" font-size="13" fill="#0b0b0b" text-anchor="end" font-weight="400">posted asks, excludable</text><line x1="281.2" y1="304" x2="454.4" y2="304" stroke="#e1e0d9" stroke-width="2"/><circle cx="281.2" cy="304" r="6" fill="#eb6834" stroke="#fcfcfb" stroke-width="2"/><circle cx="454.4" cy="304" r="6" fill="#2a78d6" stroke="#fcfcfb" stroke-width="2"/><text x="575" y="378" font-size="12" fill="#898781" text-anchor="middle" font-weight="400">improvement in the hidden features (log scale)</text>
</svg>
