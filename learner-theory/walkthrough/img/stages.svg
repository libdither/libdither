<svg xmlns="http://www.w3.org/2000/svg" width="940" height="525" viewBox="0 0 940 525" role="img" aria-label="A learner as a chain of stages: a dense network and a market for control" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif">
<title>A learner as a chain of stages: a dense network and a market for control</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#52514e"/></marker>
<marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/></marker>
<marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/></marker></defs>
<rect width="940" height="525" rx="10" fill="#fcfcfb"/>
<text x="24" y="34" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">A dense network: white-box stages</text><text x="24" y="54" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Each unit is a firm. Its output is a good every unit in the next layer reads at once; credit comes back as a price.</text><line x1="124" y1="108" x2="316" y2="87" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="108" x2="316" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="108" x2="316" y2="171" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="108" x2="316" y2="213" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="150" x2="316" y2="87" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="150" x2="316" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="150" x2="316" y2="171" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="150" x2="316" y2="213" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="192" x2="316" y2="87" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="192" x2="316" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="192" x2="316" y2="171" stroke="#c3c2b7" stroke-width="1"/><line x1="124" y1="192" x2="316" y2="213" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="87" x2="536" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="87" x2="536" y2="171" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="129" x2="536" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="129" x2="536" y2="171" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="171" x2="536" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="171" x2="536" y2="171" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="213" x2="536" y2="129" stroke="#c3c2b7" stroke-width="1"/><line x1="344" y1="213" x2="536" y2="171" stroke="#c3c2b7" stroke-width="1"/><circle cx="110" cy="108" r="13" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><circle cx="110" cy="150" r="13" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><circle cx="110" cy="192" r="13" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="110" y="246" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">inputs x</text><circle cx="330" cy="87" r="13" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><circle cx="330" cy="129" r="13" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><circle cx="330" cy="171" r="13" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><circle cx="330" cy="213" r="13" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="330" y="246" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">hidden units</text><circle cx="550" cy="129" r="13" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><circle cx="550" cy="171" r="13" fill="#fcfcfb" stroke="#52514e" stroke-width="1.5"/><text x="550" y="246" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">output units</text><rect x="690" y="122" width="150" height="56" rx="8" fill="#f0efec" stroke="#c3c2b7"/><text x="765" y="146" font-size="13" fill="#0b0b0b" text-anchor="middle" font-weight="600">the customer</text><text x="765" y="164" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">pays y − h per unit</text><path d="M566,150 L686,150" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><text x="170" y="84" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">goods flow forward →</text><path d="M760,184 C 700,330 420,330 140,205" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><text x="455" y="322" font-size="12" fill="#52514e" text-anchor="middle" font-weight="400">← prices flow back: what one more unit of each output is worth (backprop’s signals)</text><line x1="24" y1="345" x2="916" y2="345" stroke="#e1e0d9" stroke-width="1"/><text x="24" y="375" font-size="15" fill="#0b0b0b" text-anchor="start" font-weight="600">A market for control: black-box stages</text><text x="24" y="395" font-size="12.5" fill="#52514e" text-anchor="start" font-weight="400">Each stage is a moment in time. Agents bid to own the world’s state; the winner acts, and the next owner buys the state from it.</text><rect x="84" y="443" width="52" height="34" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="110" y="465" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400">state 0</text><path d="M138,460 L300,460" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><circle cx="190" cy="423" r="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><circle cx="220" cy="423" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><circle cx="250" cy="423" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><path d="M296,491 C 250,507 190,507 144,491" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><rect x="304" y="443" width="52" height="34" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="330" y="465" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400">state 1</text><path d="M358,460 L520,460" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><circle cx="410" cy="423" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><circle cx="440" cy="423" r="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><circle cx="470" cy="423" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><path d="M516,491 C 470,507 410,507 364,491" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><rect x="524" y="443" width="52" height="34" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="550" y="465" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400">state 2</text><path d="M578,460 L740,460" stroke="#52514e" stroke-width="1.5" fill="none" marker-end="url(#arrow)"/><circle cx="630" cy="423" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><circle cx="660" cy="423" r="6" fill="#fcfcfb" stroke="#898781" stroke-width="1.5"/><circle cx="690" cy="423" r="8" fill="#eb6834" stroke="#eb6834" stroke-width="1.5"/><path d="M736,491 C 690,507 630,507 584,491" stroke="#2a78d6" stroke-width="2" fill="none" marker-end="url(#arrow-blue)"/><rect x="744" y="443" width="52" height="34" rx="6" fill="#f0efec" stroke="#52514e" stroke-width="1.5"/><text x="770" y="465" font-size="12" fill="#0b0b0b" text-anchor="middle" font-weight="400">state 3</text><text x="716" y="427" font-size="12" fill="#52514e" text-anchor="start" font-weight="400">agents bidding; filled: the winner</text><text x="916" y="512" font-size="12" fill="#52514e" text-anchor="end" font-weight="400">payment for the state flows back</text>
</svg>
